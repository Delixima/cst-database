# Netlify configuration - static site, no build step, no Functions.
[build]
  publish = "public"
  command = ""

# Security headers for every page.
# connect-src allows your Supabase project (REST + Auth + Realtime websockets).
# If you use a Supabase custom domain, add it to connect-src.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"

# HTML and config must never be served stale after a deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Clean URLs: Netlify serves /logs from logs.html. Old links ending in .html
# (bookmarks, shared links, emails already sent) are redirected to the clean
# address; the query string (?id=…) is kept.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard.html"
  to = "/dashboard"
  status = 301
  force = true

[[redirects]]
  from = "/log-new.html"
  to = "/log-new"
  status = 301
  force = true

[[redirects]]
  from = "/logs.html"
  to = "/logs"
  status = 301
  force = true

[[redirects]]
  from = "/log.html"
  to = "/log"
  status = 301
  force = true

[[redirects]]
  from = "/player.html"
  to = "/player"
  status = 301
  force = true

[[redirects]]
  from = "/offenses.html"
  to = "/offenses"
  status = 301
  force = true

[[redirects]]
  from = "/members.html"
  to = "/members"
  status = 301
  force = true

[[redirects]]
  from = "/audit.html"
  to = "/audit"
  status = 301
  force = true

# Unknown paths show the sign-in page with a 404 status.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
